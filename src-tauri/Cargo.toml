[package]
name = "trace"
version = "0.1.0"
edition = "2021"
description = "Local-only computer activity receipts for builders."
authors = ["Lambdaforge"]
default-run = "trace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"

# OS collector is Windows-only for V0. Exact feature flags track the installed
# `windows` crate version — the compiler will name any that are missing.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Dns",
  "Win32_Networking_WinSock",
  "Win32_System_LibraryLoader",
] }

[profile.release]
strip = true
lto = true

